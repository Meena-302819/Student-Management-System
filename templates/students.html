<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Students</title>

<link rel="stylesheet" href="{{ url_for('static', filename='students.css') }}">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h2>SMS</h2>

<ul>

<li><a href="/dashboard"><i class="fas fa-home"></i> Dashboard</a></li>

<li><a href="/students"><i class="fas fa-users"></i> Students</a></li>

<li><a href="/addstudent"><i class="fas fa-user-plus"></i> Add Student</a></li>

<li><a href="/reports"><i class="fas fa-chart-bar"></i> Reports</a></li>

<li><a href="/"><i class="fas fa-sign-out-alt"></i> Logout</a></li>

</ul>

</div>

<!-- Main -->

<div class="main">

<header>

<h1>Students List</h1>

</header>

<!-- Search -->

<div class="search-box">

<input
type="text"
id="search"
placeholder="Search by Name / Roll No / Department"
onkeyup="searchStudent()">

<button onclick="refreshStudents()">

<i class="fas fa-sync"></i>

Refresh

</button>

</div>

<!-- Table -->

<div class="table-container">

<table>

<thead>

<tr>

<th>ID</th>

<th>Name</th>

<th>Roll No</th>

<th>Department</th>

<th>Year</th>

<th>Gender</th>

<th>Type</th>

<th>Total Fee</th>

<th>Paid</th>

<th>Pending</th>

<th>Status</th>

<th>Action</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
